spring.application.name=bank-cqrs
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank_cqrs}
spring.datasource.username=${DB_USER:bank}
spring.datasource.password=${DB_PASSWORD:bank}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
axon.axonserver.servers=${AXON_SERVER:localhost:8124}
axon.serializer.events=jackson
axon.serializer.general=jackson
axon.serializer.messages=jackson
